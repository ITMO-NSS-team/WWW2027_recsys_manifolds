<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Bilevel geometry optimisation loop</title>
  <desc id="desc">Interactions are subsampled into a learnable distance matrix D. A differentiable Isomap block turns D into coordinates Z through a kNN graph, Floyd-Warshall shortest paths and MDS. A recommender scores items. The BCE training loss is differentiated back through the Isomap block into D; HR@10 and NDCG@10 are evaluation metrics.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- 1. Interactions -->
    <rect x="40" y="55" width="120" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="100" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Interactions</text>
    <text x="100" y="106" text-anchor="middle" font-size="11.5" fill="#57606a">user–item events</text>

    <!-- 2. Subsample -->
    <rect x="185" y="55" width="120" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="245" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Subsample</text>
    <text x="245" y="106" text-anchor="middle" font-size="11.5" fill="#57606a">users × items</text>

    <!-- 3. Distance matrix -->
    <rect x="330" y="55" width="120" height="80" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="390" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Distance D</text>
    <text x="390" y="106" text-anchor="middle" font-size="11.5" fill="#57606a">learnable matrix</text>

    <!-- 4. Differentiable Isomap, with its three internal steps -->
    <rect x="475" y="42" width="330" height="106" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.8"/>
    <text x="640" y="62" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0969da">Differentiable Isomap</text>

    <rect x="487" y="72" width="90" height="52" rx="7" fill="#ffffff" stroke="#a5d6ff" stroke-width="1.2"/>
    <text x="532" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">kNN</text>
    <text x="532" y="106" text-anchor="middle" font-size="9.5" fill="#57606a">neighbor graph</text>

    <rect x="587" y="72" width="110" height="52" rx="7" fill="#ffffff" stroke="#a5d6ff" stroke-width="1.2"/>
    <text x="642" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f2328">Floyd-Warshall</text>
    <text x="642" y="106" text-anchor="middle" font-size="9.5" fill="#57606a">geodesic distances</text>

    <rect x="707" y="72" width="86" height="52" rx="7" fill="#ffffff" stroke="#a5d6ff" stroke-width="1.2"/>
    <text x="750" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">MDS</text>
    <text x="750" y="106" text-anchor="middle" font-size="9.5" fill="#57606a">coordinates Z</text>

    <g stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow-small)">
      <line x1="577" y1="98" x2="585" y2="98"/>
      <line x1="697" y1="98" x2="705" y2="98"/>
    </g>

    <!-- 5. Recommender -->
    <rect x="830" y="55" width="140" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="900" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Recommender</text>
    <text x="900" y="102" text-anchor="middle" font-size="11.5" fill="#57606a">NCF · SASRec</text>
    <text x="900" y="119" text-anchor="middle" font-size="11.5" fill="#57606a">non-learnable heads</text>

    <!-- 6. Scores -->
    <rect x="995" y="55" width="140" height="80" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="1065" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Scores</text>
    <text x="1065" y="106" text-anchor="middle" font-size="11.5" fill="#57606a">user–item scores</text>

    <!-- forward arrows -->
    <g stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)">
      <line x1="160" y1="95" x2="181" y2="95"/>
      <line x1="305" y1="95" x2="326" y2="95"/>
      <line x1="450" y1="95" x2="471" y2="95"/>
      <line x1="805" y1="95" x2="826" y2="95"/>
      <line x1="970" y1="95" x2="991" y2="95"/>
    </g>
    <text x="815" y="87" text-anchor="middle" font-size="10" fill="#57606a">Z</text>

    <!-- training objective: BCE, from the recommender -->
    <path d="M 900 135 V 158 H 890 V 180" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="800" y="180" width="180" height="64" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/>
    <text x="890" y="208" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">BCE loss</text>
    <text x="890" y="228" text-anchor="middle" font-size="11.5" fill="#57606a">training objective</text>

    <!-- outer gradient -->
    <path d="M 800 212 H 798 V 115 H 450" fill="none" stroke="#8250df" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-feedback)"/>
    <text x="640" y="138" text-anchor="middle" font-size="11.5" fill="#8250df">outer gradient: ∂L_BCE/∂D</text>

    <!-- evaluation branch, from the scores -->
    <path d="M 1065 135 V 158 H 1075 V 180" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
    <rect x="990" y="180" width="170" height="64" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="1075" y="208" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2328">Ranking metrics</text>
    <text x="1075" y="228" text-anchor="middle" font-size="11.5" fill="#57606a">HR@10 · NDCG@10</text>

    <!-- legend -->
    <text x="40" y="282" font-size="11" fill="#57606a">solid: forward pass · dashed: outer gradient · dotted: evaluation</text>
  </g>
</svg>
